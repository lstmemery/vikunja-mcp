[project]
name = "vikunja-mcp"
version = "0.2.224"
description = "Workflow-level MCP server for Vikunja: queue -> claim -> design -> build -> review with enforced gates"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
# Upper bounds are LOAD-BEARING here, not hygiene. Consumers launch us via
# `uvx --from git+...@stable`, which re-resolves from THIS list and ignores uv.lock —
# so the lock protects CI and the local .venv, and protects nobody in production.
# mcp 2.0.0 (2026-07-28) removed `mcp.server.fastmcp`; every consumer's server died on
# import with "Connection closed" while tests stayed green on the locked 1.28.1.
# Pin the majors of anything imported at module scope, and verify a release the way a
# consumer starts it: uvx --refresh-package vikunja-mcp --from git+...@stable vikunja-mcp --version
dependencies = ["mcp>=2,<3", "httpx>=0.27,<1"]

[project.scripts]
vikunja-mcp = "vikunja_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vikunja_mcp"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
# TWO limits, deliberately different, because they answer different questions (tracker #669).
# `line-length` is the WRAP TARGET: the formatter's limit, and what this repo wraps to by hand when
# it remembers to (77 lines were over it the day the gate went in). On its own it checks NOTHING
# here — ruff's default rule set is E4/E7/E9/F, so before #669 `ruff check .` was green on a
# 140-character line and would have been green on a 400-character one. Careful with the usual next
# thought, that the unrun formatter was a latent safety net: MEASURED, `ruff format` on the pre-fix
# api.py reformats the file and leaves the 140-character line at 140, because it re-wraps CODE and
# does not reflow comments or string content — which is 36 of the 77. So E501 below is not a second
# opinion about long lines, it is the only one.
#   ONE CAVEAT, so a later edit does not misread this: "drives no check" holds only while the
#   pycodestyle table below exists. Delete that table and `line-length` becomes E501's limit
#   directly — measured at `d857280`, 94 errors (it was 76 at #669's own landing `1ac64ca`; the
#   band has grown WITH the tree, and the rate is flat rather than rising — 2.70 such lines per
#   1000 then against 2.55 now — so do not read the growth as evidence of anything). Looks like
#   a relaxation, lands as a tightening.
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E501 makes the limit mechanical, and it counts DISPLAY WIDTH rather than bytes — which is
# `len(line)` for everything this repo contains, since it holds no tabs and no wide characters
# (measured at all four shas named in tests/unit/test_line_length_gate.py). That is the reason to
# reach for it instead of the `awk length()` reflex: this repo's prose is full of
# em-dashes (3 bytes) and Cyrillic (2 bytes each), so at `d857280` there were 1626 lines at or
# under 100 characters but over 100 BYTES, and 1004 at or under 110 characters but over 110 bytes.
# A byte counter calls every one of those a violation; ruff calls none of them, correctly. Those
# are two separate sets and neither is nested in the other — measured at the same sha, 989 lines
# are in both, 637 only in the first and 15 only in the second. Both count em-dashes in PROSE, so
# both move with every landing: those same two limits at `3db8ef9` give 1015 and 569. The 413 that
# used to stand beside the 1015 here was the 120 ruler and retired with the ceiling — it is NOT
# the same measurement taken earlier. Re-measure, do not quote.
#   Selecting E501 is necessary and NOT sufficient: `ignore`, `per-file-ignores` and a `# noqa`
#   each switch it back off with `select` untouched. tests/unit/test_line_length_gate.py reads the
#   first two, because a pin that only checks `select` certifies a gate that may not be running.
select = ["E4", "E7", "E9", "F", "E501"]

[tool.ruff.lint.pycodestyle]
# The HARD gate sits at 110, not at `line-length`, and the gap was measured rather than split
# — #711 ratcheted it down from #669's 120, which cost SIX hand re-wraps because only six
# lines in the whole tree were above 110. It was NOT taken to 100: measured then, 59 of the
# 102 lines in the band were exactly 101 characters and 18 more were 102, so the population
# is a one-or-two-character tail past the wrap target, and the composition below still holds.
# The history #669 recorded is kept as history:
# down the middle. On 2026-08-02 seventy-seven lines exceeded 100 characters across 18 files —
# 41 of them CODE, 22 inside string literals (19 of those docstrings) and only 14 comments — and
# SEVENTY-SIX of the 77 were 116 characters or shorter. The defect this rule was turned on for
# was 140: a 24-character outlier above every other PYTHON line in the directories ruff reads,
# which is what a reflow accident looks like and what one-to-sixteen characters of overshoot does
# not. So a gate at 100 would have cost a 76-line cosmetic diff through 18 files — nine of which
# took 3 to 14 commits in the preceding 48 hours — most of it in prose owned by other open cards,
# to catch a class it is not needed for; a gate at 120 was red on exactly the one real defect and
# green the moment it was reflowed. `per-file-ignores` was the third candidate and is worse than
# either: its list would have had to name ALL EIGHTEEN files — api.py, workflow.py, server.py,
# setup_cmd.py, workspace_cmd.py and thirteen test files holding 53 of the 77 lines — so the gate
# would have been OFF in the very file where the defect happened.
# TWO HONEST LIMITS, both measured. 101-110 is convention, not enforcement — wrap at 100 anyway.
# And UNDER THIS REPO'S SETTINGS E501 exempts exactly TWO shapes on its own — the count is about
# the settings, not the rule, because two carve-outs sit outside it: a `# noqa` silences it as
# well (covered above), and ruff's `ignore-overlong-task-comments`, left at its default of false
# here, would add a third by exempting `# TODO`/`# FIXME` lines — measured, 111 characters of
# `# TODO` fire by default and go silent with that flag on. Neither of the two is "the overlong
# part holds no whitespace" — that phrasing stood here from #669 until #711's independent
# REVIEWER produced the counterexample: `# ` plus 109 `x`, 111 characters with no whitespace past
# the limit, duly reported. Measured at `d857280` on ruff
# 0.15.20 the two are: (1) a line with fewer than two whitespace-separated chunks, where there is
# no break to demand, even 201 characters pass, and leading indentation does not make a second
# chunk; and (2) a line whose LAST chunk contains the
# literal `://` while the rest fits the limit — a 136-character comment ending in a URL
# passes, the same URL with one more word after it does not. The predicate is arithmetic on the
# WHOLE line, `total - width(last chunk) <= limit`, so 110 characters ahead of the URL passes and
# 111 fires, but a trailing space counts into `total` — "the width before the URL" is a
# paraphrase, not the rule. (2) is a SUBSTRING test rather than URL recognition: `foo://…` is
# exempt, `www.example.com/…` is not. tests/unit/test_line_length_gate.py has no exemption at all
# and flags both shapes — the place the two most visibly disagree, and it is live rather than
# theoretical: with THIS table removed, so E501 falls back to `line-length` = 100, the character
# scan finds 95 lines and ruff 94, the single
# difference being tests/unit/test_api.py:731, which ends in an IPv6 URL.
max-line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
